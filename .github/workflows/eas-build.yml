name: Unpack Ride Bangla Official Website

on:
  push:
    branches:
      - main
    paths:
      - "Ride_Bangla_Official_Website.zip"
      - ".github/workflows/eas-build.yml"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify ZIP File
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$GITHUB_WORKSPACE/Ride_Bangla_Official_Website.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "Ride_Bangla_Official_Website.zip was not found."
            exit 1
          fi

          unzip -t "$ZIP_FILE"

      - name: Extract ZIP Outside Repository
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$GITHUB_WORKSPACE/Ride_Bangla_Official_Website.zip"
          EXTRACT_DIR="$RUNNER_TEMP/ride-bangla-official-website"

          rm -rf "$EXTRACT_DIR"
          mkdir -p "$EXTRACT_DIR"

          unzip -q -o "$ZIP_FILE" -d "$EXTRACT_DIR"

          if [ ! -f "$EXTRACT_DIR/package.json" ]; then
            echo "package.json was not found inside the ZIP."
            exit 1
          fi

          if [ ! -d "$EXTRACT_DIR/src" ]; then
            echo "src folder was not found inside the ZIP."
            exit 1
          fi

          echo "ZIP extracted successfully."

      - name: Copy Project Files
        shell: bash
        run: |
          set -euo pipefail

          EXTRACT_DIR="$RUNNER_TEMP/ride-bangla-official-website"

          rsync -a --delete \
            --exclude=".git/" \
            --exclude=".github/" \
            --exclude="Ride_Bangla_Official_Website.zip" \
            "$EXTRACT_DIR/" \
            "$GITHUB_WORKSPACE/"

          echo "Project files copied successfully."

      - name: Remove Uploaded ZIP
        shell: bash
        run: |
          set -euo pipefail

          rm -f "$GITHUB_WORKSPACE/Ride_Bangla_Official_Website.zip"

      - name: Verify Extracted Project
        shell: bash
        run: |
          set -euo pipefail

          test -f "$GITHUB_WORKSPACE/package.json"
          test -d "$GITHUB_WORKSPACE/src"

          echo "Project verification completed successfully."

      - name: Commit And Push Changes
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Unpack Ride Bangla Official Website"
          git push origin HEAD:main
